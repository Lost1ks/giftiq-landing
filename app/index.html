<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GiftIQ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0520; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12);
    --text: #f4f1ff; --muted: #a9a3c9; --violet: #7b5cff; --lilac: #c084fc; --gold: #f5c451;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Montserrat, system-ui, sans-serif; }
  body {
    min-height: 100vh; padding: 16px 16px 120px;
    background: radial-gradient(600px 400px at 0% -10%, rgba(123,92,255,.35), transparent 70%),
                radial-gradient(500px 400px at 110% 30%, rgba(192,132,252,.18), transparent 70%), var(--bg);
    background-attachment: fixed;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header img { width: 44px; height: 44px; border-radius: 12px; }
  header b { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  header span { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
  .hero {
    position: relative; overflow: hidden; border-radius: 22px; padding: 20px;
    background: linear-gradient(135deg, rgba(123,92,255,.55), rgba(192,132,252,.25)); border: 1px solid var(--line);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
    animation: shine 4s ease-in-out 1s infinite;
  }
  @keyframes shine { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .hero small { color: #e6defe; font-size: 13px; font-weight: 600; }
  .hero .total { font-size: 38px; font-weight: 800; margin: 6px 0 2px; }
  .hero .rub { color: #e6defe; font-size: 16px; font-weight: 600; }
  .hero .meta { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 99px; background: rgba(10,5,32,.35); }
  .tabs { display: flex; gap: 6px; margin: 18px 0 12px; padding: 4px; background: var(--card); border-radius: 14px; }
  .tabs button, .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted); font: 700 14px Montserrat, sans-serif;
    padding: 10px; border-radius: 10px; cursor: pointer;
  }
  .tabs button.on, .seg button.on { background: var(--violet); color: #fff; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { background: var(--card); font-size: 13px; padding: 8px; }
  input.search {
    width: 100%; padding: 12px 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: 600 14px Montserrat, sans-serif; outline: none;
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
  }
  .row img, .row .ph { width: 52px; height: 52px; border-radius: 12px; flex: none; object-fit: cover; background: rgba(123,92,255,.25); }
  .row .ph { display: grid; place-items: center; font-size: 24px; }
  .row .name { flex: 1; min-width: 0; }
  .row .name b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name span { color: var(--muted); font-size: 12px; font-weight: 600; }
  .row .price { text-align: right; }
  .row .price b { display: block; color: var(--lilac); font-size: 15px; }
  .row .price span { color: var(--muted); font-size: 12px; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-weight: 600; line-height: 1.5; }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: linear-gradient(transparent, var(--bg) 35%);
  }
  .actions button {
    border: 0; border-radius: 14px; padding: 13px 8px; font: 700 14px Montserrat, sans-serif; cursor: pointer;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
  }
  .actions .gold { grid-column: 1 / -1; background: linear-gradient(90deg, #f5c451, #ffdd8a); color: #2a1a00; border: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="">
  <div><b>GiftIQ</b><span id="user">трекер TG-подарков</span></div>
</header>

<section class="hero">
  <small>Стоимость коллекции</small>
  <div class="total" id="total">— TON</div>
  <div class="rub" id="totalRub">≈ — ₽</div>
  <div class="meta"><span class="chip" id="count">0 подарков</span><span class="chip" id="rate">1 TON ≈ — ₽</span></div>
</section>

<div class="tabs">
  <button class="on" data-tab="mine">Коллекция</button>
  <button data-tab="market">Рынок</button>
</div>

<section id="mine"><div class="list" id="mineList"></div></section>

<section id="market" hidden>
  <div class="seg">
    <button class="on" data-sort="floor">Дорогие</button>
    <button data-sort="sales">Хиты 24ч</button>
    <button data-sort="cheap">Дешёвые</button>
  </div>
  <input class="search" id="search" placeholder="Поиск подарка…">
  <div class="list" id="marketList"><div class="empty">Загружаю цены Portals…</div></div>
</section>

<div class="actions">
  <button class="gold" id="caseBtn">🎁 Бесплатный кейс Epic Gift</button>
  <button id="addBtn">➕ Добавить подарок</button>
  <button id="newsBtn">📢 Канал</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const BOT = 'https://t.me/giftiq_tg_bot';
const CHANNEL = 'https://t.me/giftIQ_news';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d = 2) => Number(v).toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d});
const rubFmt = ton => Math.round(ton * rate).toLocaleString('ru-RU');

// данные коллекции бот кладёт в ссылку: #d=base64url(JSON {u, r, e, g:[[slug, name, number, price]]})
function readData() {
  try {
    const m = location.hash.match(/d=([\w-]+)/);
    if (!m) return null;
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
const data = readData() || {g: []};
let rate = data.r || 100;

function open(url) {
  if (tg && tg.openTelegramLink && url.startsWith('https://t.me/')) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}
function img(src, alt) {
  return `<img src="${src}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>🎁</div>'">`;
}

function renderMine() {
  const gifts = data.g || [];
  const total = gifts.reduce((s, g) => s + (g[3] || 0), 0);
  $('total').textContent = `${num(total)} TON`;
  $('totalRub').textContent = `≈ ${rubFmt(total)} ₽`;
  $('rate').textContent = `1 TON ≈ ${num(rate, 0)} ₽`;
  const n = gifts.length;
  $('count').textContent = `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'подарок' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'подарка' : 'подарков'}`;
  if (data.u) $('user').textContent = '@' + data.u;
  $('mineList').innerHTML = n ? gifts.map(([slug, name, number, price]) => `
    <div class="row" data-link="https://t.me/nft/${esc(slug)}">
      ${img(`https://nft.fragment.com/gift/${esc(slug.toLowerCase())}.small.jpg`)}
      <div class="name"><b>${esc(name)}</b><span>#${number}</span></div>
      <div class="price"><b>${price ? num(price) + ' TON' : '—'}</b><span>${price ? '≈ ' + rubFmt(price) + ' ₽' : 'нет цены'}</span></div>
    </div>`).join('')
    : `<div class="empty">Коллекция пустая.<br>Нажми «Добавить подарок» и пришли боту ссылку вида t.me/nft/…</div>`;
}

let market = [], sortBy = 'floor';
function renderMarket() {
  const q = $('search').value.trim().toLowerCase();
  let rows = market.filter(c => c.floor > 0 && (!q || c.name.toLowerCase().includes(q)));
  rows.sort(sortBy === 'sales' ? (a, b) => b.sales - a.sales : sortBy === 'cheap' ? (a, b) => a.floor - b.floor : (a, b) => b.floor - a.floor);
  $('marketList').innerHTML = rows.slice(0, 60).map(c => `
    <div class="row" data-link="https://t.me/portals">
      ${img(`https://nft.fragment.com/gift/${esc(c.key)}-1.small.jpg`)}
      <div class="name"><b>${esc(c.name)}</b><span>продаж за 24ч: ${c.sales.toLocaleString('ru-RU')}</span></div>
      <div class="price"><b>${num(c.floor, c.floor < 100 ? 2 : 0)} TON</b><span>≈ ${rubFmt(c.floor)} ₽</span></div>
    </div>`).join('') || '<div class="empty">Ничего не нашлось</div>';
}

async function loadMarket() {
  try {
    const r = await fetch('https://portal-market.com/api/collections?limit=200');
    const j = await r.json();
    market = (j.collections || []).map(c => ({
      key: c.short_name, name: c.name, floor: parseFloat(c.floor_price) || 0, sales: c.sales_24h_count || 0,
    }));
    renderMarket();
  } catch (e) {
    $('marketList').innerHTML = '<div class="empty">Не удалось загрузить цены. Попробуй позже.</div>';
  }
}

async function loadRate() {
  try {
    const r = await fetch('https://tonapi.io/v2/rates?tokens=ton&currencies=rub');
    const v = (await r.json()).rates.TON.prices.RUB;
    if (v > 0) { rate = v; renderMine(); if (market.length) renderMarket(); }
  } catch (e) { /* остаётся курс от бота */ }
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('mine').hidden = b.dataset.tab !== 'mine';
  $('market').hidden = b.dataset.tab !== 'market';
  if (b.dataset.tab === 'market' && !market.length) loadMarket();
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
});
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  sortBy = b.dataset.sort; renderMarket();
});
$('search').oninput = renderMarket;
document.addEventListener('click', e => { const row = e.target.closest('.row'); if (row) open(row.dataset.link); });
$('caseBtn').onclick = () => open(data.e || 'https://t.me/epic_gift_bot/app');
$('addBtn').onclick = () => { open(BOT); tg && tg.close(); };
$('newsBtn').onclick = () => open(CHANNEL);

if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0a0520'); tg.setBackgroundColor('#0a0520'); } catch (e) {}
}
renderMine();
loadRate();
</script>
</body>
</html>
